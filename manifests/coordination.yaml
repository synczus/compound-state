canonical_source: kestrel/manifest.yaml
governance:
  subagent_policy:
    default: spawn
    description: Every agent (Kairos, Nemoclaw, OpenClaw, Hermes) spawns subagents
      freely.
    rules:
    - Subagents get one goal + context. No multi-hop delegation.
    - Subagents CANNOT spawn further subagents (max_depth=1).
    - If a subagent writes files, verify the side effect before reporting done.
    rationale: 'Spawn when: 3+ tool calls needed, heavy research, parallel workstreams.
      Don''t spawn for single-tool calls.'
  perplexity_research:
    description: Every agent writes a Perplexity JSON when they need external research.
      Chase copies, pastes into Perplexity, brings results back.
    json_schema:
      hop: brain-dump-hop
      version: '1.2'
      date: YYYY-MM-DD
      short_title: '[short descriptive name]'
      context: "[specific research question \u2014 what the agent needs to know]"
      instructions: 'You must respond with ONLY valid JSON. No markdown. No explanations.
        Research deeply. Return schema: { stage, hop_title, date, context_preserved,
        key_findings:[], sources:[], uncertainties:[], research_gaps:[], recommended_next_hop:''''
        }'
    output_schema: '{ stage, hop_title, date, context_preserved, key_findings:[],
      sources:[], uncertainties:[], research_gaps:[], recommended_next_hop:'''' }'
    rule: "When generating a Perplexity JSON, include the exact context the agent\
      \ needs researched. Be specific \u2014 list URLs, API names, and exact questions.\
      \ Perplexity cannot browse context from the agent's conversation."
hop_rules:
  default: brain-dump-hop
  description: One general-purpose hop for brainstorming, research, and turning scattered
    ideas into structured notes + actionable work.
  reference: kestrel/hop-banking-rules.md
  template: kestrel/hops/brain-dump/TEMPLATE.md
  persistence:
  - event-bus.md (short notes, agent-injectable)
  - hop-notes/YYYY-MM-DD_<short-title>.md (rich full notes)
  - hops/brain-dump/YYYY-MM-DD_<short-title>/ (full archive)
  pipeline:
    steps:
    - name: ai-hangout
      role: dump + orchestrate
      description: "You dump raw thoughts \u2192 I hand you JSON for Perplexity"
    - name: perplexity
      role: research
      output: strict JSON
      description: "You paste my JSON \u2192 Perplexity returns JSON \u2192 you paste\
        \ back here"
    - name: ai-hangout-banking
      role: notes + tasks + execute
      description: I take rich notes, create tagged tasks in master-todo, execute
        safe work
