1e", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "variable:33ec155036a5cc06708adb53baf8520c", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "variable:e3406ab422d9217f648cd03a8ed67aa5", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "variable:f9d5ee4c6f7e79ed9a008dc94bbcd6c1", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "variable:f4ee5dc09c750fac605d4e73ce53d746", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "variable:2001a5e532cadd739ad671f548868a42", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "function:a619ae284007c77d421fcdfc70a3821a", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "function:f1359abf70369a3bd2c8a4af8ae85042", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "function:4fe616929dbbae4d236e0712c4bd944d", "k": "contains", "l": null}, {"s": "file:swarm/build_hub_intake.py", "t": "function:3ccbcd6a3bdc7b0e258e64d809d554bd", "k": "contains", "l": null}];

  document.getElementById("stats").textContent =
    `${nodes.length} symbols · ${edges.length} relationships`;

  // Build graph data
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  // Remove edges that reference missing nodes
  edges = edges.filter(e => nodeMap[e.s] && nodeMap[e.t]);

  // D3 simulation
  const svg = d3.select("#graph")
    .append("svg")
    .attr("width", "100%")
    .attr("height", "100%");

  const width = window.innerWidth;
  const height = window.innerHeight;

  const g = svg.append("g");

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom);

  // Links
  const link = g.append("g")
    .selectAll("line")
    .data(edges)
    .join("line")
    .attr("stroke", "#30363d")
    .attr("stroke-width", 0.5)
    .attr("stroke-opacity", 0.6);

  // Nodes
  const node = g.append("g")
    .selectAll("circle")
    .data(nodes)
    .join("circle")
    .attr("r", d => nodeRadius[d.kind] || 4)
    .attr("fill", d => COLORS[d.kind] || COLORS.default)
    .attr("opacity", 0.85)
    .attr("stroke", "#1a1a1a")
    .attr("stroke-width", 0.5)
    .call(d3.drag()
      .on("start", dragStarted)
      .on("drag", dragged)
      .on("end", dragEnded));

  // Labels (only for important nodes)
  const labels = g.append("g")
    .selectAll("text")
    .data(nodes.filter(d => ["class","function","method","constant"].includes(d.kind)))
    .join("text")
    .text(d => d.name.length > 18 ? d.name.slice(0,16)+"…" : d.name)
    .attr("class", "node-label")
    .attr("dx", d => nodeRadius[d.kind] + 3)
    .attr("dy", 3);

  // Tooltip
  const tooltip = d3.select("#tooltip");
  node.on("mouseover", (event, d) => {
    tooltip.style("display", "block")
      .html(`
        <div class="name">${d.name}</div>
        <div class="detail">${d.kind} · ${d.file}:${d.line}</div>
        <div class="detail">${d.lang || ""}</div>
      `);
  }).on("mousemove", (event) => {
    tooltip.style("left", (event.clientX + 15) + "px")
      .style("top", (event.clientY - 10) + "px");
  }).on("mouseout", () => tooltip.style("display", "none"));

  // Force simulation
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.id).distance(80).strength(0.3))
    .force("charge", d3.forceManyBody().strength(-120))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide().radius(d => nodeRadius[d.kind] + 2))
    .on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("cx", d => d.x).attr("cy", d => d.y);
      labels.attr("x", d => d.x).attr("y", d => d.y);
    });

  function dragStarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragEnded(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
}

load();
window.addEventListener("resize", () => {
  d3.select("svg").attr("width", window.innerWidth).attr("height", window.innerHeight);
});
</script>
