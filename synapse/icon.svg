<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0a0a0f"/>
  <!-- Neural node cluster -->
  <circle cx="22" cy="18" r="4" fill="none" stroke="#00ff88" stroke-width="2"/>
  <circle cx="42" cy="14" r="4" fill="none" stroke="#3388ff" stroke-width="2"/>
  <circle cx="32" cy="32" r="5" fill="none" stroke="#aa66ff" stroke-width="2"/>
  <circle cx="48" cy="36" r="4" fill="none" stroke="#00ff88" stroke-width="2"/>
  <circle cx="16" cy="44" r="4" fill="none" stroke="#3388ff" stroke-width="2"/>
  <!-- Synaptic connections -->
  <line x1="22" y1="18" x2="32" y2="32" stroke="#1a3a2a" stroke-width="1.5"/>
  <line x1="42" y1="14" x2="32" y2="32" stroke="#1a2a3a" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="48" y2="36" stroke="#1a3a2a" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="16" y2="44" stroke="#1a2a3a" stroke-width="1.5"/>
