  <line x1="16" y1="44" x2="48" y2="36" stroke="#2a1a3a" stroke-width="1"/>
  <!-- Signal pulses -->
  <circle cx="26" cy="24" r="1.5" fill="#00ff88" opacity="0.8"/>
  <circle cx="36" cy="28" r="1.5" fill="#3388ff" opacity="0.8"/>
