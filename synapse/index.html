<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNAPSE — Compound Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --border: #1e1e2e;
    --green: #00ff88;
    --red: #ff3355;
    --amber: #ffaa33;
    --blue: #3388ff;
    --purple: #aa66ff;
    --text: #c8c8d4;
    --dim: #555566;
    --glow: 0 0 20px rgba(0,255,136,0.05);
  }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  /* Header */
  .header {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--green); }
  .logo span { color: var(--dim); font-weight: 300; }
  .header-meta { font-size: 11px; color: var(--dim); text-align: right; }
  .header-meta .live { color: var(--green); display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Main grid */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto 1fr 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }
  .panel {
    background: var(--panel);
    padding: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-title {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-title .badge { font-size: 8px; padding: 2px 6px; border-radius: 3px; background: var(--border); }

  /* Agent panel (full width) */
  .grid .agents { grid-column: 1 / 4; }
  .agent-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .agent-card {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    flex: 1;
    min-width: 160px;
    transition: border-color 0.3s;
  }
  .agent-card.online { border-left: 2px solid var(--green); }
  .agent-card.offline { border-left: 2px solid var(--red); opacity: 0.5; }
  .agent-card .name { font-size: 13px; font-weight: 600; color: var(--text); }
  .agent-card .role { font-size: 9px; color: var(--dim); margin-top: 2px; }
  .agent-card .status { font-size: 10px; margin-top: 4px; }
  .agent-card .online .status { color: var(--green); }
  .agent-card .offline .status { color: var(--red); }
  .agent-card .last-seen { font-size: 9px; color: var(--dim); margin-top: 2px; }

  /* System panel */
  .sys-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .sys-metric {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .sys-metric .label { font-size: 8px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .sys-metric .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .sys-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .sys-bar .fill { height: 100%; border-radius: 2px; transition: width 1s; }
  .fill.green { background: var(--green); }
  .fill.amber { background: var(--amber); }
  .fill.red { background: var(--red); }
  .fill.blue { background: var(--blue); }

  /* Market panel */
  .market-list { flex: 1; overflow-y: auto; }
  .market-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid rgba(30,30,46,0.5);
    font-size: 12px;
  }
  .market-row .sym { font-weight: 600; }
  .market-row .price { font-family: 'JetBrains Mono', monospace; }
  .market-row .change.up { color: var(--green); }
  .market-row .change.down { color: var(--red); }
  .market-row .signal { font-size: 9px; padding: 1px 4px; border-radius: 2px; background: var(--border); }

  /* Budget panel */
  .budget-bar {
    height: 24px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    margin: 6px 0;
  }
  .budget-bar .fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1s;
    background: linear-gradient(90deg, var(--green), var(--amber));
  }
  .budget-bar .fill.danger { background: linear-gradient(90deg, var(--amber), var(--red)); }
  .budget-text { display: flex; justify-content: space-between; font-size: 11px; }
  .budget-text .used { color: var(--dim); }

  /* Activity log */
  .log-panel { grid-column: 1 / 4; }
  .log-list {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.6;
  }
  .log-entry { padding: 2px 0; display: flex; gap: 8px; }
  .log-entry .time { color: var(--dim); flex-shrink: 0; width: 60px; }
  .log-entry .tag { color: var(--purple); flex-shrink: 0; }
  .log-entry .msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-entry .msg.green { color: var(--green); }
  .log-entry .msg.red { color: var(--red); }
  .log-entry .msg.blue { color: var(--blue); }
  .log-entry .msg.amber { color: var(--amber); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Striker panel - make it span 2 cols */
  .panel.striker { grid-column: span 2; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">Synapse <span>// compound dashboard</span></div>
  <div class="header-meta">
    <span class="live"></span><span id="lastUpdate">connecting...</span>
  </div>
</div>

<div class="grid">
  <!-- Agents -->
  <div class="panel agents">
    <div class="panel-title">Agents <span class="badge" id="agentCount">0 online</span></div>
    <div class="agent-row" id="agentRow"></div>
  </div>

  <!-- System -->
  <div class="panel">
    <div class="panel-title">System <span class="badge" id="hostname">—</span></div>
    <div class="sys-grid">
      <div class="sys-metric">
        <div class="label">CPU</div>
        <div class="value" id="cpuVal">—</div>
        <div class="sys-bar"><div class="fill green" id="cpuBar" style="width:0%"></div></div>
      </div>
      <div class="sys-metric">
        <div class="label">RAM</div>
        <div class="value" id="ramVal">—</div>
        <div class="sys-bar"><div class="fill blue" id="ramBar" style="width:0%"></div></div>
      </div>
      <div class="sys-metric">
        <div class="label">Disk</div>
        <div class="value" id="diskVal">—</div>
        <div class="sys-bar"><div class="fill amber" id="diskBar" style="width:0%"></div></div>
      </div>
      <div class="sys-metric">
        <div class="label">Uptime</div>
        <div class="value" id="uptimeVal">—</div>
      </div>
    </div>
  </div>

  <!-- Budget -->
  <div class="panel">
    <div class="panel-title">OpenRouter Budget <span class="badge" id="budgetLabel">$0/$50</span></div>
    <div class="budget-bar"><div class="fill" id="budgetBar" style="width:0%"></div></div>
    <div class="budget-text">
      <span class="used" id="budgetUsed">$0.00 used today</span>
      <span id="budgetRemaining">$50.00 left</span>
    </div>
    <div style="margin-top:auto;padding-top:8px;font-size:9px;color:var(--dim)" id="budgetWeekly">Weekly: —</div>
  </div>

  <!-- Market / Striker -->
  <div class="panel striker">
    <div class="panel-title">Striker Signals <span class="badge" id="signalCount">0</span></div>
    <div class="market-list" id="marketList">
      <div class="market-row"><span class="sym">BTC-USD</span><span class="price" id="btcPrice">—</span><span class="change" id="btcChange">—</span></div>
      <div class="market-row"><span class="sym">ETH-USD</span><span class="price" id="ethPrice">—</span><span class="change" id="ethChange">—</span></div>
      <div class="market-row"><span class="sym">SOL-USD</span><span class="price" id="solPrice">—</span><span class="change" id="solChange">—</span></div>
    </div>
  </div>

  <!-- Crons -->
  <div class="panel">
    <div class="panel-title">Scheduler <span class="badge" id="cronCount">0/0</span></div>
    <div id="cronList" style="flex:1;overflow-y:auto;font-size:10px;"></div>
  </div>

  <!-- Activity Log -->
  <div class="panel log-panel">
    <div class="panel-title">Activity <span class="badge">live</span></div>
    <div class="log-list" id="logList">
      <div class="log-entry"><span class="time">—</span><span class="tag">∞</span><span class="msg">connecting to loom server...</span></div>
    </div>
  </div>
</div>

<script>
const API = '/api';
const MAX_LOG = 100;
let logEl = document.getElementById('logList');
let lastLogLen = 0;

function addLog(tag, msg, cls = '') {
  let time = new Date().toLocaleTimeString('en-US', {hour12:false});
  let entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="time">${time}</span><span class="tag">${tag}</span><span class="msg ${cls}">${msg}</span>`;
  logEl.appendChild(entry);
  lastLogLen++;
  if (lastLogLen > MAX_LOG) {
    logEl.removeChild(logEl.firstChild);
    lastLogLen--;
  }
}

function updateDashboard(data) {
  // Agents
  let agentRow = document.getElementById('agentRow');
  if (data.agents) {
    agentRow.innerHTML = '';
    let online = 0;
    data.agents.forEach(a => {
      let cls = a.active ? 'online' : 'offline';
      if (a.active) online++;
      let card = document.createElement('div');
      card.className = `agent-card ${cls}`;
      card.innerHTML = `
        <div class="name">@${a.name}</div>
        <div class="role">${a.lane || '—'}</div>
        <div class="status">${a.status || '—'}</div>
        <div class="last-seen">${a.last_seen ? new Date(a.last_seen).toLocaleTimeString() : '—'}</div>
      `;
      agentRow.appendChild(card);
    });
    document.getElementById('agentCount').textContent = `${online}/${data.agents.length} online`;
  }

  // System
  if (data.system) {
    document.getElementById('hostname').textContent = data.system.hostname || '—';
    let cpu = data.system.cpu_pct || 0;
    let ram = data.system.ram_pct || 0;
    let disk = data.system.disk_pct || 0;
    document.getElementById('cpuVal').textContent = cpu.toFixed(1) + '%';
    document.getElementById('ramVal').textContent = ram.toFixed(1) + '%';
    document.getElementById('diskVal').textContent = disk.toFixed(1) + '%';
    document.getElementById('uptimeVal').textContent = data.system.uptime || '—';
    let cpuBar = document.getElementById('cpuBar');
    cpuBar.style.width = cpu + '%';
    cpuBar.className = 'fill ' + (cpu > 80 ? 'red' : cpu > 50 ? 'amber' : 'green');
    let ramBar = document.getElementById('ramBar');
    ramBar.style.width = ram + '%';
    ramBar.className = 'fill ' + (ram > 80 ? 'red' : ram > 60 ? 'amber' : 'blue');
    document.getElementById('diskBar').style.width = disk + '%';
  }

  // Budget
  if (data.budget) {
    let used = data.budget.daily || 0;
    let limit = data.budget.daily_limit || 50;
    let pct = Math.min(used / limit * 100, 100);
    document.getElementById('budgetLabel').textContent = `$${used.toFixed(1)}/$${limit}`;
    let bar = document.getElementById('budgetBar');
    bar.style.width = pct + '%';
    bar.className = 'fill ' + (pct > 85 ? 'danger' : '');
    document.getElementById('budgetUsed').textContent = `$${used.toFixed(2)} used today`;
    document.getElementById('budgetRemaining').textContent = `$${(limit - used).toFixed(2)} left`;
    if (data.budget.weekly_estimated) {
      document.getElementById('budgetWeekly').textContent = `Weekly est: $${data.budget.weekly_estimated.toFixed(2)}`;
    }
  }

  // Market
  if (data.market) {
    data.market.forEach(m => {
      let sym = m.symbol || m.pair || '';
      let priceEl = document.getElementById(sym.split('-')[0].toLowerCase() + 'Price');
      let changeEl = document.getElementById(sym.split('-')[0].toLowerCase() + 'Change');
      if (priceEl) {
        priceEl.textContent = '$' + (m.price || m.last_price || '—');
        let chg = m.change_pct || m.change || 0;
        if (changeEl) {
          changeEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
          changeEl.className = 'change ' + (chg >= 0 ? 'up' : 'down');
        }
      }
    });
    if (data.signal_count !== undefined) {
      document.getElementById('signalCount').textContent = data.signal_count;
    }
  }

  // Crons
  if (data.crons) {
    let cronEl = document.getElementById('cronList');
    let healthy = 0, total = data.crons.length;
    cronEl.innerHTML = '';
    data.crons.forEach(c => {
      let isHealthy = c.status === 'healthy';
      if (isHealthy) healthy++;
      let row = document.createElement('div');
      row.style.cssText = 'padding:3px 0;border-bottom:1px solid rgba(30,30,46,0.3);display:flex;justify-content:space-between';
      row.innerHTML = `
        <span>${c.label || c.name}</span>
        <span style="color:${isHealthy ? 'var(--green)' : 'var(--red)'}">${isHealthy ? '✓' : '✗'} ${c.freq || ''}</span>
      `;
      cronEl.appendChild(row);
    });
    document.getElementById('cronCount').textContent = `${healthy}/${total} healthy`;
  }

  // Log
  if (data.log && Array.isArray(data.log)) {
    data.log.slice(-5).forEach(l => addLog(l.tag || '∞', l.msg || '—', l.cls || ''));
  } else {
    addLog('∞', `dash refreshed at ${new Date().toLocaleTimeString()}`, 'green');
  }

  document.getElementById('lastUpdate').textContent = `updated ${new Date().toLocaleTimeString('en-US', {hour12:false})}`;
}

async function fetchAll() {
  try {
    // Try aggregated health
    let resp = await fetch(API + '/state');
    let data = await resp.json();
    updateDashboard(data);
  } catch(e) {
    addLog('✗', `fetch error: ${e.message}`, 'red');
    document.getElementById('lastUpdate').textContent = 'offline';
  }
}

// Poll every 5s
fetchAll();
setInterval(fetchAll, 5000);
addLog('∞', 'synapse dashboard initialized', 'green');

  // Chat overlay
  async function loadChat() {
    try {
      let r = await fetch('/api/chat');
      let data = await r.json();
      let el = document.getElementById('chatList');
      if (!el) return;
      el.innerHTML = '';
      (data || []).slice(-30).forEach(function(e) {
        let row = document.createElement('div');
        row.style.cssText = 'padding:2px 0;display:flex;gap:6px;font-size:10px;';
        let color = e.role === 'user' ? 'var(--green)' : 'var(--blue)';
        row.innerHTML = '<span style="color:var(--dim);width:50px;flex-shrink:0">' + (e.time||'') + '</span><span style="color:'+color+';font-weight:600;flex-shrink:0">' + (e.sender||'') + ':</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + e.msg + '</span>';
        el.appendChild(row);
      });
      if (el.scrollHeight > el.clientHeight) el.scrollTop = el.scrollHeight;
    } catch(e) {}
  }

  function toggleChat() {
    let o = document.getElementById('chatOverlay');
    o.style.display = o.style.display === 'none' ? 'flex' : 'none';
  }

  setInterval(loadChat, 3000);
  setTimeout(loadChat, 500);

</script>

<!-- Chat overlay -->
<div id="chatOverlay" style="display:none;position:fixed;bottom:0;right:12px;width:500px;height:400px;background:var(--panel);border:1px solid var(--border);border-radius:6px 6px 0 0;z-index:1000;overflow:hidden;flex-direction:column;font-size:11px;box-shadow:0 -4px 30px rgba(0,0,0,0.5)">
  <div style="padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;cursor:pointer;flex-shrink:0" onclick="toggleChat()">
    <span style="color:var(--green);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:2px;">📡 Chat Log</span>
    <span style="color:var(--dim)">−</span>
  </div>
  <div id="chatList" style="flex:1;padding:4px 8px;overflow-y:auto;">
    <div style="color:var(--dim);font-size:10px;">loading chat...</div>
  </div>
</div>

<script>
// Add toggle button in header
document.addEventListener('DOMContentLoaded', function() {
  var meta = document.querySelector('.header-meta');
  if (meta) {
    var btn = document.createElement('span');
    btn.style.cssText = 'cursor:pointer;color:var(--dim);font-size:11px;margin-right:12px;';
    btn.textContent = '[📡 chat]';
    btn.onclick = toggleChat;
    meta.parentNode.insertBefore(btn, meta);
  }
});
</script>

</body>
</html>
